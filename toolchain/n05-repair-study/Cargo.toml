[package]
name = "n05-repair-study"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
publish = false

# Deliberately independent: the production workspace/lock has no Asupersync edge.
[workspace]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
franken-stream = { path = "../../crates/franken-stream" }
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "14032b8f2c832ee7ef1946404f5efb18162af045", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[dev-dependencies]
franken-alloc-probe = { path = "../../crates/franken-alloc-probe" }
raptorq = "=2.0.1"

[[bin]]
name = "n05_repair_study"
path = "src/main.rs"

# Preregistered before the first native observation. Cargo may build the integration
# worker through dev while the harness uses test: both use the identical host recipe.
[profile.dev]
opt-level = 3
debug = 0

[profile.test]
opt-level = 3
debug = 0
