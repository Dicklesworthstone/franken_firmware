[package]
name = "ffw-hello-init"
version = "0.1.0"
edition = "2021"

# Freestanding no_std PID-1 probe. A musl-named target does not imply libc
# linkage or hosted std qualification. Keep this bootstrap independent of
# the application workspace and its evolving dependencies.

[workspace]

[dependencies]

[features]
# Off by default, so the E07/E03 bootstrap probe is exactly what it was. On, PID 1 also runs the franken-speaker
# smoke step after the probes: `/franken-speaker --catalog` as a child process (src/speaker_smoke.rs).
speaker-smoke = []
# Off by default, and needs `speaker-smoke`. On, PID 1 also runs `/franken-speaker --platform-startup` as a second child after
# the catalog step (P02, src/speaker_smoke.rs `run_platform`), with its own wrapper lines; the host runner judges the
# speaker's six FFW_PLATFORM:* lines (toolchain/src/platform_expect.py). Without it the guest is exactly the speaker-smoke one.
speaker-platform = ["speaker-smoke"]
# Off by default, and needs `speaker-platform`. On, the platform step passes one more argument to the child,
# `--entropy-provider=legacy-dev-random-test-environment`, and prints it on the BEGIN line: the speaker then tries the explicit legacy
# `/dev/random` provider in this harness guest (P02, `provider=` in toolchain/src/platform_expect.py). Without it the guest is exactly
# the speaker-platform one.
speaker-platform-legacy-test-env = ["speaker-platform"]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
