[package]
name = "franken-platform"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
franken-board-profile.workspace = true
# 64-bit shared state: `src/lib.rs` re-exports franken-atomic's cells on every target (big-endian MIPS32 and
# PPC32 have no native 64-bit atomics, and a cfg-selected alias would give host and device different APIs).
franken-atomic.workspace = true

[dev-dependencies]
franken-test-support.workspace = true

[features]
default = []
# Deterministic simulated kernel (`sim::SeededSim`) for host harnesses. Never enabled for a device image; the doubles
# answer `Provenance::Simulated`. See docs/contracts/p02.md.
sim = []
