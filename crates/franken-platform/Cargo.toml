[package]
name = "franken-platform"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
franken-board-profile.workspace = true

# `src/lib.rs` re-exports `AtomicU64`/`AtomicI64` from portable-atomic only under this same cfg
# (big-endian MIPS32 and PPC32 have no native 64-bit atomics). Everywhere else the crate is never
# named, so declaring it unconditionally made cargo warn `unused dependency` on the host.
[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic.workspace = true

[dev-dependencies]
franken-test-support.workspace = true

[features]
default = []
# Deterministic simulated kernel (`sim::SeededSim`) for host harnesses. Never enabled for a device image; the doubles
# answer `Provenance::Simulated`. See docs/contracts/p02.md.
sim = []
