[package]
name = "franken-speaker"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Test-only: the Virtual House harness links the test-support oracles and fixtures. It is optional and off by
# default, so a default (device) build has no dependency edge onto franken-test-support. The P01 workspace
# contract (virtual_house_harness, cargo_feature = "harness") records and checks this.
franken-test-support = { workspace = true, optional = true }
franken-board-profile.workspace = true
franken-platform.workspace = true
# The one counted unsafe edge (P01 `unsafe_exceptions`): the Linux syscall backend the device speaker builds its platform layer over
# (`--platform-startup`). A plain normal dependency so the contract sees the edge; on a host build the leaf is plain data and
# the backend type exists only for big-endian 32-bit MIPS and PowerPC. The speaker itself keeps `forbid(unsafe_code)`.
franken-platform-linux.workspace = true
franken-hal.workspace = true
franken-dsp.workspace = true
franken-clock.workspace = true
franken-stream.workspace = true
franken-codec = { path = "../franken-codec" }
franken-session.workspace = true
franken-control.workspace = true

[dev-dependencies]
franken-test-support.workspace = true

[features]
default = []
# The Virtual House harness (`--virtual-house`, `--self-test`). Never part of a device image.
harness = ["dep:franken-test-support"]
# Native services and artwork (P01 BLK-006). Each is named in the P01 workspace contract (`cargo_feature`, owner_crate =
# "franken-speaker"), a profile that disables one is built without its flag, and `services::report()` says whether this build
# selected it. No provider code is behind any flag yet: a selected service reports selected, unimplemented, unqualified, never
# ready. Each service's bead (S01, A01, T01, X01; artwork's owner) takes over its own flag and may make it enable the
# implementation (`dep:...` or `franken-control/...`). `protected_render` and `synchronized_groups` have no flag: see services.rs.
spotify_connect = []
airplay2 = []
tailnet_native = []
alexa_bridge = []
artwork = []
